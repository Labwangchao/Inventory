function impData(){const items=IMP.items.map((r,i)=>({id:i+1,code:r[0],name:r[1],unit:r[2],price:r[3],co:r[4],cat:r[5],min:0}));let seq=0;
const lots=IMP.lots.map(l=>({bc:'LAB'+l[5].replace(/-/g,'').slice(2)+String(++seq).padStart(4,'0'),item:l[0],lot:l[1],exp:l[2],qty:l[3],rem:l[4],date:l[5]}));
const mv=lots.map(l=>({t:l.date+'T00:00:00.000Z',type:'in',bc:l.bc,item:l.item,lot:l.lot,qty:l.rem,ref:'นำเข้าจากชีตเดิม',by:''}));return{items,lots,mv,seq}}

if(!S.imp){const d=impData();Object.assign(S,{items:d.items,lots:d.lots,mv:d.mv,reqs:[],seq:d.seq,imp:1})}
if(!S.mv){S.mv=[];S.lots.forEach(l=>{const t=l.date+'T00:00:00.000Z',b={bc:l.bc,item:l.item,lot:l.lot,by:''};S.mv.push({...b,t,type:'in',qty:l.qty,ref:'ยอดยกมา'});if(l.qty>l.rem)S.mv.push({...b,t,type:'out',qty:l.qty-l.rem,ref:'จ่ายก่อนหน้า'})})}
const save=()=>{try{localStorage.setItem('wl2',JSON.stringify(S))}catch(e){}cloudPush()};
const log=(type,l,qty,ref)=>S.mv.push({t:new Date().toISOString(),type,bc:l.bc,item:l.item,lot:l.lot,qty,ref:ref||'',by:un});
let un=null;try{un=localStorage.getItem('wl2me')}catch(e){}

${so.msg[0]?`<div class="res ${so.msg[0].c}">${so.msg[0].c=='r'?'✖':'✔'} ${esc(so.msg[0].t)}</div>`:''}<div class="card"><h2 style="margin-bottom:10px">ประวัติการสแกน</h2>${so.msg.map(m=>`<div class="al ${m.c}"><small style="display:inline">${m.at}</small> ${esc(m.t)}</div>`).join('')||'<small>ยังไม่มีการสแกน</small>'}</div>`};
const beep=ok=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:220;o.type=ok?'sine':'square';g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(ok?.12:.35))}catch(e){}};
function scanIn(el){const v=el.value.trim(),l=S.lots.find(x=>x.bc==v),q=Math.max(1,+$('#iq').value||1);
if(!l){beep(false);toast('ไม่พบบาร์โค้ด '+v);el.select();return}
if(days(l.exp)<0){beep(false);toast('Lot นี้หมดอายุแล้ว ไม่รับเพิ่ม');el.select();return}
l.qty+=q;l.rem+=q;log('in',l,q,'รับเพิ่มด้วยการสแกน');save();beep(true);render();toast('รับเพิ่ม '+it(l.item).name+' Lot '+l.lot+' +'+q+' (รวมเหลือ '+l.rem+')');setTimeout(()=>{const e=$('#is');e&&e.focus()},0)}
function scanOut(v){v=v.trim();if(!v)return;const l=S.lots.find(x=>x.bc==v),q=Math.max(1,+$('#oq').value||1);
const say=(t,c)=>{beep(c!='r');so.msg.unshift({t,c,at:new Date().toLocaleTimeString('en-GB')});so.msg=so.msg.slice(0,10);render()};
if(!l)return say('ไม่พบบาร์โค้ด '+v,'r');
const nm=it(l.item).name+' Lot '+l.lot;if(days(l.exp)<0)return say(nm+' หมดอายุแล้ว ห้ามจ่าย','r');
let take=q,r=null,ln=null;
if(so.mode!='free'){r=S.reqs.find(x=>x.n==so.mode);ln=r.lines.find(x=>x.item==l.item&&got(x)<x.qty);if(!ln)return say('ใบเบิก '+r.id+' ไม่ต้องการ '+it(l.item).name+' เพิ่มแล้ว','r');take=Math.min(q,ln.qty-got(ln))}
if(l.rem<take)return say(nm+' เหลือ '+l.rem+' ไม่พอจ่าย '+take,'r');
const fi=S.lots.filter(x=>x.item==l.item&&x.rem>0&&days(x.exp)>=0).sort((a,b)=>a.exp.localeCompare(b.exp))[0];
l.rem-=take;log('out',l,take,r?r.id:'ใช้งานในห้องปฏิบัติการ');let end=false;
if(r){ln.out=ln.out||[];const o=ln.out.find(x=>x.bc==l.bc);o?o.n+=take:ln.out.push({lot:l.lot,bc:l.bc,n:take});if(r.lines.every(x=>got(x)>=x.qty)){r.st='issued';r.del=T;so.mode='free';end=true}}
save();const w=fi&&fi.bc!=l.bc;
say('ตัด '+nm+' −'+take+' (เหลือ '+l.rem+')'+(w?' · ⚠ ควรจ่าย Lot '+fi.lot+' ก่อน (หมดอายุ '+fd(fi.exp)+')':'')+(end?' · ใบเบิกครบแล้ว สถานะเป็นรอยืนยันรับของ':''),w?'w':'k');setTimeout(()=>{const e=$('#os');e&&e.focus()},0)}
function adv(n){const r=S.reqs.find(x=>x.n==n);
if(r.st=='approved'){const add=[];let fail=false;
for(const ln of r.lines){ln.out=ln.out||[];let need=ln.qty-got(ln);
for(const l of S.lots.filter(l=>l.item==ln.item&&l.rem>0&&days(l.exp)>=0).sort((a,b)=>a.exp.localeCompare(b.exp))){if(need<=0)break;const t=Math.min(need,l.rem);add.push([ln,l,t]);need-=t;l.rem-=t}
if(need>0){fail=true;break}}
if(fail){add.forEach(([ln,l,t])=>l.rem+=t);toast('สต็อกที่ยังไม่หมดอายุไม่พอ');return}
add.forEach(([ln,l,t])=>{ln.out.push({lot:l.lot,bc:l.bc,n:t});log('out',l,t,r.id)});r.del=T}
r.st={pending:'approved',approved:'issued',issued:'done'}[r.st];save();render()}

function ovw(){alert(`ปีงบประมาณ ${FY}\nรายการพัสดุ ${S.items.length} รายการ\nใบเบิกทั้งหมด ${S.reqs.length} ใบ\nจ่ายแล้ว/รับเรียบร้อย ${S.reqs.filter(r=>r.st=='issued'||r.st=='done').length} ใบ`)}
function doAuthOld(e){e.preventDefault();const u=$('#lu').value.trim(),p=$('#lp').value;
if(mode=='reg'){if(S.users.some(x=>x.un==u)){toast('ชื่อผู้ใช้นี้ถูกใช้แล้ว');return false}S.users.push({un:u,pw:p,name:$('#an').value,unit:$('#au').value,role:$('#ar').value});save();mode='in';toast('สมัครสำเร็จ เข้าสู่ระบบได้เลย');render();return false}
const x=S.users.find(y=>y.un==u&&y.pw==p);if(!x){toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');return false}
un=u;try{localStorage.setItem('wl2me',u)}catch(e){}page='home';render();return false}
function out(){un=null;try{localStorage.removeItem('wl2me')}catch(e){}render()}
function profOld(){const u=me();u.name=$('#pn').value||u.name;u.unit=$('#pu').value||u.unit;if($('#pp').value)u.pw=$('#pp').value;save();render();toast('บันทึกแล้ว')}
function cfg(){S.cfg={s:$('#cs').value,e:$('#ce').value,p:$('#cp').value};save();render();toast('บันทึกกำหนดการแล้ว')}
function mkOld(){if(!open()&&!staff()){toast('ขณะนี้ปิดรับใบเบิก');return}
for(const c of cart){if(!(c.qty>0)){toast('ระบุจำนวนให้ถูกต้อง');return}if(c.qty>tot(c.item)){toast('จำนวนเกินสต็อก: '+it(c.item).name);return}}
const n=Math.max(0,...S.reqs.map(r=>r.n))+1;S.reqs.push({n,id:'REQ-'+FY+'-'+String(n).padStart(3,'0'),un,unit:me().unit,date:T,st:'pending',lines:cart.map(c=>({item:+c.item,qty:+c.qty}))});cart=[{item:S.items[0].id,qty:1}];save();toast('ส่งใบเบิกแล้ว');go('hist')}
function advOld(n){const r=S.reqs.find(x=>x.n==n);
if(r.st=='approved'){const done=[];let fail=false;for(const ln of r.lines){let need=ln.qty;ln.out=[];for(const l of S.lots.filter(l=>l.item==ln.item&&l.rem>0&&days(l.exp)>=0).sort((a,b)=>a.exp.localeCompare(b.exp))){const t=Math.min(need,l.rem);l.rem-=t;need-=t;ln.out.push({lot:l.lot,n:t});done.push([l,t]);if(!need)break}if(need){fail=true;break}}
if(fail){done.forEach(([l,t])=>l.rem+=t);r.lines.forEach(l=>delete l.out);toast('สต็อกที่ยังไม่หมดอายุไม่พอ');return}r.del=T}
r.st={pending:'approved',approved:'issued',issued:'done'}[r.st];save();render()}
function rcv(e){e.preventDefault();let id=$('#ri').value;
if(id==='new'){const n=$('#rn').value.trim();if(!n){toast('กรอกชื่อพัสดุใหม่');return false}id=Math.max(0,...S.items.map(i=>i.id))+1;S.items.push({id,name:n,unit:$('#ru').value||'หน่วย',min:+$('#rm').value||0})}
